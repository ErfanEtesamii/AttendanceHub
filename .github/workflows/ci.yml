name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python scripts/secret_scan.py
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: attendhub
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: attendhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U attendhub -d attendhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://attendhub:ci_password@localhost:5432/attendhub
      TEST_DATABASE_URL: postgresql+psycopg://attendhub:ci_password@localhost:5432/attendhub
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - name: Generate ephemeral test secrets
        run: |
          python -c "import os,secrets; f=open(os.environ['GITHUB_ENV'],'a'); f.write('JWT_SECRET='+secrets.token_urlsafe(48)+'\nENCRYPTION_KEY='+secrets.token_urlsafe(48)+'\n'); f.close()"
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
